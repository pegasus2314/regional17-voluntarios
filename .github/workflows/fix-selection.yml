name: Repair selection navigation
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair app.js
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("table':'centros_educativos'", "table:'centros_educativos'")
          s=s.replace("table':'actividades'", "table:'actividades'")
          s=s.replace("table':'participaciones'", "table:'participaciones'")
          s=s.replace("table':'eventos'", "table:'eventos'")
          p.write_text(s,encoding='utf-8')
          PY
          node --check app.js
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git diff --cached --quiet || git commit -m "fix: repair app.js syntax"
          git push