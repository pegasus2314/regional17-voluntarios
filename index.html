<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de Voluntarios · Regional 17 Monte Plata</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --navy: #0B2545; --navy-2: #133366; --paper: #F6F7F9; --line: #E1E5EB;
    --ink: #1B2430; --muted: #667085; --accent: #F2A93B;
    --ok-bg: #E7F6EC; --ok-fg: #1E7A3D; --ok-dot:#2FA84F;
    --wait-bg:#FFF4E1; --wait-fg:#95610A; --wait-dot:#F2A93B;
    --off-bg:#FBEAEA; --off-fg:#B23A3A; --off-dot:#D64545;
    --new-bg:#EEF0F3; --new-fg:#5A6472; --new-dot:#9AA4B2;
    --err-bg:#FBEAEA; --err-fg:#B23A3A;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: var(--ink); background: var(--paper); margin: 0; padding: 24px;
    -webkit-font-smoothing: antialiased;
  }
  body.rv-auth-active { padding: 0; }
  a { color: inherit; }
  ::selection { background: var(--accent); color: #3A2400; }
  :focus-visible { outline: 2px solid var(--navy-2); outline-offset: 2px; }
  #rv-root {
    max-width: 1100px; margin: 0 auto; background: #fff; border-radius: 14px;
    overflow: hidden; border: 1px solid var(--line);
  }
  .rv-head { background: linear-gradient(135deg, var(--navy) 0%, var(--navy-2) 100%); color: #fff; padding: 22px 26px; }
  .rv-head h1 { margin: 0 0 4px; font-size: 20px; letter-spacing: .2px; }
  .rv-head p { margin: 0; font-size: 13px; color: #C9D6EA; }
  .rv-head-row { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; }
  .rv-me { text-align:right; font-size:12px; color:#C9D6EA; }
  .rv-me .role { display:inline-block; margin-top:4px; padding:2px 9px; border-radius:999px; background:rgba(255,255,255,.15); font-weight:600; }
  .rv-me button { margin-top:6px; background:none; border:1px solid rgba(255,255,255,.35); color:#fff; padding:4px 10px; border-radius:6px; font-size:11px; cursor:pointer; }
  .rv-tabs { display: flex; gap: 6px; margin-top: 16px; flex-wrap: wrap; }
  .rv-tab { padding: 8px 14px; border-radius: 999px; font-size: 13px; cursor: pointer; background: rgba(255,255,255,.12); color: #fff; border: 1px solid rgba(255,255,255,.2); transition: background .15s, transform .1s; }
  .rv-tab:hover { background: rgba(255,255,255,.2); }
  .rv-tab.active { background: var(--accent); color: #3A2400; border-color: var(--accent); font-weight: 600; }
  .rv-body { padding: 20px 26px 26px; }
  .rv-conn { display:flex; align-items:center; gap:6px; font-size:11px; color:var(--muted); margin-bottom:14px; }
  .rv-conn .dot { width:7px; height:7px; border-radius:50%; background:var(--ok-dot); }
  .rv-conn.off .dot { background: var(--off-dot); }

  .rv-stats { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .rv-stat { flex: 1; min-width: 110px; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
  .rv-stat .n { font-size: 22px; font-weight: 700; } .rv-stat .l { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
  .rv-stat.ok .n { color: var(--ok-fg); } .rv-stat.wait .n { color: var(--wait-fg); } .rv-stat.off .n { color: var(--off-fg); } .rv-stat.new .n { color: var(--new-fg); }

  .rv-filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .rv-filters input, .rv-filters select { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 13px; background: #fff; color: var(--ink); }
  .rv-filters input { flex: 1; min-width: 160px; }

  table.rv-table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); }
  .rv-table th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .3px; color: var(--muted); padding: 10px 12px; background: #FAFBFC; border-bottom: 1px solid var(--line); }
  .rv-table td { padding: 10px 12px; border-bottom: 1px solid var(--line); font-size: 13px; vertical-align: middle; }
  .rv-table tr:last-child td { border-bottom: none; } .rv-table tr:hover td { background: #FAFBFC; }
  .rv-name { font-weight: 600; } .rv-sub { font-size: 11px; color: var(--muted); }

  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .badge .dot { width: 7px; height: 7px; border-radius: 50%; }
  .badge.ok { background: var(--ok-bg); color: var(--ok-fg); } .badge.ok .dot { background: var(--ok-dot); }
  .badge.wait { background: var(--wait-bg); color: var(--wait-fg); } .badge.wait .dot { background: var(--wait-dot); }
  .badge.off { background: var(--off-bg); color: var(--off-fg); } .badge.off .dot { background: var(--off-dot); }
  .badge.new { background: var(--new-bg); color: var(--new-fg); } .badge.new .dot { background: var(--new-dot); }
  .role-pill { display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:600; background:var(--new-bg); color:var(--new-fg); }
  .role-pill.admin { background:#EAE3FB; color:#5B33B0; } .role-pill.coordinador { background:#DDEBFF; color:#1B4FA0; }

  .rv-areas-cell { display: flex; flex-wrap: wrap; gap: 4px; max-width: 240px; }
  .rv-chip { background: #EEF0F3; color: #445; font-size: 11px; padding: 2px 7px; border-radius: 6px; }

  .rv-btn { padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line); background: #fff; font-size: 12px; cursor: pointer; font-weight: 600; color: var(--navy-2); transition: background .15s, border-color .15s, transform .1s; }
  .rv-btn:hover { border-color: var(--navy-2); } .rv-btn:disabled { opacity:.5; cursor:not-allowed; }
  .rv-btn:active:not(:disabled) { transform: scale(.98); }
  .rv-btn.primary { background: var(--navy); color: #fff; border-color: var(--navy); }
  .rv-btn.primary:hover { background: var(--navy-2); }
  .rv-btn.danger { color: var(--off-fg); } .rv-btn.small { padding: 4px 8px; font-size: 11px; }

  .rv-empty { text-align: center; padding: 30px; color: var(--muted); font-size: 13px; }
  .rv-banner { background: #FFF4E1; border: 1px solid #F2D9A6; color: #7A5200; font-size: 12px; padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; line-height: 1.5; }
  .rv-banner a { color: #7A5200; }

  .rv-overlay { position: fixed; inset: 0; background: rgba(11,37,69,.45); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
  .rv-modal { background: #fff; border-radius: 14px; width: 100%; max-width: 460px; max-height: 88vh; overflow-y: auto; padding: 22px; }
  .rv-modal h3 { margin: 0 0 2px; font-size: 16px; } .rv-modal .rv-sub { margin-bottom: 16px; }
  .rv-field { margin-bottom: 14px; }
  .rv-field label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .3px; }
  .rv-field select, .rv-field textarea, .rv-field input[type=text], .rv-field input[type=email], .rv-field input[type=password] {
    width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 13px; font-family: inherit;
  }
  .rv-checks { display: flex; flex-wrap: wrap; gap: 8px; }
  .rv-check { display: flex; align-items: center; gap: 6px; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 12px; cursor: pointer; }
  .rv-check input { margin: 0; }
  .rv-modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  .rv-readonly-badge { display:flex; align-items:center; gap:8px; background: var(--paper); border:1px solid var(--line); border-radius:8px; padding:9px 10px; font-size:13px; }

  .rv-self-search { position: relative; margin-bottom: 18px; }
  .rv-self-list { position: absolute; top: 100%; left: 0; right: 0; background: #fff; border: 1px solid var(--line); border-radius: 8px; margin-top: 4px; max-height: 220px; overflow-y: auto; z-index: 10; box-shadow: 0 8px 20px rgba(11,37,69,.12); }
  .rv-self-item { padding: 9px 12px; font-size: 13px; cursor: pointer; } .rv-self-item:hover { background: var(--paper); }
  .rv-self-card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
  .rv-self-card h3 { margin: 0 0 2px; }
  .rv-saved-msg { font-size: 12px; color: var(--ok-fg); font-weight: 600; margin-top: 10px; min-height: 16px; }
  .rv-empty-self { color: var(--muted); font-size: 13px; text-align: center; padding: 40px 0; }

  .rv-district-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; }
  .rv-district-card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .rv-district-card h4 { margin: 0 0 2px; font-size: 14px; } .rv-district-card .rv-sub { margin-bottom: 10px; }
  .rv-centro-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13px; gap:8px; }
  .rv-centro-row:last-child { border-bottom: none; }
  .rv-add-centro { display: flex; gap: 6px; margin-top: 10px; }
  .rv-add-centro input { flex: 1; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; font-size: 12px; }
  .rv-centro-count { font-size: 11px; color: var(--muted); }

  .rv-auth-wrap { max-width: 380px; margin: 60px auto; padding: 0 16px; }
  .rv-auth-card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:28px; }
  .rv-auth-card h2 { margin:0 0 4px; font-size:18px; } .rv-auth-card p.rv-sub { margin:0 0 20px; }
  .rv-auth-error { background:var(--err-bg); color:var(--err-fg); font-size:12.5px; padding:10px 12px; border-radius:8px; margin-bottom:16px; display:flex; align-items:flex-start; gap:8px; line-height:1.45; animation: rv-shake .32s ease; }
  @keyframes rv-shake { 10%,90%{transform:translateX(-1px);} 20%,80%{transform:translateX(2px);} 30%,50%,70%{transform:translateX(-4px);} 40%,60%{transform:translateX(4px);} }

  /* ---------- LOGIN: pantalla completa, dividida en desktop ---------- */
  .rv-auth-page { min-height: 100vh; width: 100%; background: var(--paper); animation: rv-fade .35s ease-out; }
  @keyframes rv-fade { from{opacity:0;} to{opacity:1;} }
  .rv-auth-split { min-height: 100vh; display: flex; }
  .rv-auth-brand {
    flex: 1 1 46%; position: relative; overflow: hidden;
    background: radial-gradient(1100px 620px at 12% 8%, rgba(242,169,59,.16), transparent 55%),
                linear-gradient(150deg, var(--navy) 0%, var(--navy-2) 62%, #0D2C55 100%);
    color: #fff; display: flex; align-items: center; padding: 60px;
  }
  .rv-auth-brand::before, .rv-auth-brand::after {
    content: ''; position: absolute; border-radius: 50%; opacity: .10; background: var(--accent);
  }
  .rv-auth-brand::before { width: 420px; height: 420px; right:-180px; top:-180px; }
  .rv-auth-brand::after { width: 300px; height: 300px; left:-180px; bottom:-150px; }
  .rv-auth-brand-inner { max-width: 520px; position: relative; z-index: 1; }
  .rv-brand-mark { width: 64px; height: 64px; border-radius: 16px; display:flex; align-items:center; justify-content:center; background: rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.22); font-size:30px; margin-bottom:24px; }
  .rv-auth-brand h1 { font-size: 38px; line-height: 1.08; margin:0 0 12px; letter-spacing:-.7px; }
  .rv-auth-brand p { font-size:15px; line-height:1.65; color:#D5E0F0; margin:0; max-width:470px; }
  .rv-brand-points { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin-top:28px; }
  .rv-brand-point { background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.14); border-radius:10px; padding:10px 12px; font-size:12px; color:#E8EEF7; }
  .rv-auth-form-side { flex: 0 0 470px; display:flex; align-items:center; justify-content:center; padding:38px; background:#fff; }
  .rv-auth-form { width:100%; max-width:360px; }
  .rv-auth-form .eyebrow { font-size:11px; text-transform:uppercase; letter-spacing:1.2px; color:var(--muted); font-weight:700; margin-bottom:7px; }
  .rv-auth-form h2 { font-size:26px; letter-spacing:-.3px; margin:0 0 6px; }
  .rv-auth-form > p { font-size:13px; color:var(--muted); margin:0 0 22px; line-height:1.5; }
  .rv-auth-form .rv-field { margin-bottom:13px; }
  .rv-auth-form .rv-field label { color:#475467; }
  .rv-auth-form .rv-field input { min-height:42px; }
  .rv-auth-submit { width:100%; min-height:44px; margin-top:4px; }
  .rv-auth-note { text-align:center; font-size:11px; color:var(--muted); margin-top:16px; line-height:1.5; }
  .rv-auth-footer { text-align:center; font-size:10px; color:#98A2B3; margin-top:26px; }

  .rv-status-page { min-height: 100vh; display:flex; align-items:center; justify-content:center; background:var(--paper); padding:24px; }
  .rv-loading { color:var(--muted); font-size:13px; }

  @media (max-width: 800px) {
    body { padding: 0; }
    .rv-auth-split { flex-direction:column; }
    .rv-auth-brand { flex:none; min-height:38vh; padding:38px 26px; }
    .rv-auth-brand h1 { font-size:30px; }
    .rv-brand-points { grid-template-columns:1fr; }
    .rv-auth-form-side { flex:1; padding:30px 22px 36px; }
    .rv-auth-form { max-width:420px; }
    .rv-body { padding:16px; }
    .rv-head { padding:18px 16px; }
    .rv-table { display:block; overflow-x:auto; }
  }
</style>
</head>
<body>
<div id="rv-auth-mount"></div>

<script>
/*
 * Registro de Voluntarios · Regional 17 Monte Plata
 * Versión reparada
 *
 * La protección externa evita que el bloque de aplicación se evalúe dos veces
 * en entornos donde la página/preview pueda inyectarse o ejecutarse nuevamente.
 */
(function(){
  if (window.__RV_APP_LOADED__) {
    console.warn('Regional 17: la aplicación ya estaba cargada; se evita una segunda ejecución.');
    return;
  }
  window.__RV_APP_LOADED__ = true;

  (function(){
    'use strict';

    const SUPABASE_URL = 'TU-PROYECTO';
    const SUPABASE_ANON_KEY = 'TU-ANON-KEY';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let session = null;
    let currentUser = null;
    let volunteers = [];
    let districts = [];
    let activeTab = 'volunteers';
    let searchTerm = '';
    let statusFilter = 'all';
    let districtFilter = 'all';
    let roleFilter = 'all';

    const $ = (id) => document.getElementById(id);
    const esc = (value) => String(value ?? '').replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));

    function renderConfigNeeded(){
      document.body.classList.add('rv-auth-active');
      $('rv-auth-mount').innerHTML = `
        <div class="rv-status-page">
          <div class="rv-auth-card" style="max-width:520px;width:100%">
            <h2>Configuración pendiente</h2>
            <p class="rv-sub">La aplicación está cargada, pero todavía necesita las credenciales de Supabase en el código.</p>
            <div class="rv-banner">Reemplaza <strong>TU-PROYECTO</strong> y <strong>TU-ANON-KEY</strong> por los valores correspondientes de tu proyecto Supabase.</div>
          </div>
        </div>`;
    }

    function renderStartupError(error){
      $('rv-auth-mount').innerHTML = `
        <div class="rv-status-page">
          <div class="rv-auth-card" style="max-width:520px;width:100%">
            <h2>No se pudo iniciar la aplicación</h2>
            <p class="rv-sub">Ocurrió un error al conectar con el servicio.</p>
            <div class="rv-auth-error">${esc(error?.message || error || 'Error desconocido')}</div>
            <button class="rv-btn primary" onclick="location.reload()">Reintentar</button>
          </div>
        </div>`;
    }

    function renderAuth(errorMessage=''){
      document.body.classList.add('rv-auth-active');
      $('rv-auth-mount').innerHTML = `
        <div class="rv-auth-page">
          <div class="rv-auth-split">
            <section class="rv-auth-brand">
              <div class="rv-auth-brand-inner">
                <div class="rv-brand-mark">🤝</div>
                <h1>Registro de Voluntarios</h1>
                <p>Plataforma de gestión y coordinación de voluntarios de la Regional 17 Monte Plata.</p>
                <div class="rv-brand-points">
                  <div class="rv-brand-point">✓ Gestión centralizada</div>
                  <div class="rv-brand-point">✓ Seguimiento de estados</div>
                  <div class="rv-brand-point">✓ Organización por distritos</div>
                  <div class="rv-brand-point">✓ Acceso por roles</div>
                </div>
              </div>
            </section>
            <section class="rv-auth-form-side">
              <form class="rv-auth-form" id="rv-login-form">
                <div class="eyebrow">Regional 17 · Monte Plata</div>
                <h2>Iniciar sesión</h2>
                <p>Accede con las credenciales autorizadas para administrar el registro.</p>
                ${errorMessage ? `<div class="rv-auth-error">${esc(errorMessage)}</div>` : ''}
                <div class="rv-field">
                  <label for="rv-email">Correo electrónico</label>
                  <input id="rv-email" type="email" autocomplete="email" required placeholder="correo@ejemplo.com">
                </div>
                <div class="rv-field">
                  <label for="rv-password">Contraseña</label>
                  <input id="rv-password" type="password" autocomplete="current-password" required placeholder="••••••••">
                </div>
                <button class="rv-btn primary rv-auth-submit" type="submit">Entrar</button>
                <div class="rv-auth-note">Si no tienes acceso, solicita las credenciales al administrador del sistema.</div>
                <div class="rv-auth-footer">Regional 17 Monte Plata</div>
              </form>
            </section>
          </div>
        </div>`;

      $('rv-login-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const email = $('rv-email').value.trim();
        const password = $('rv-password').value;
        const button = event.submitter || $('rv-login-form').querySelector('button[type=submit]');
        button.disabled = true;
        button.textContent = 'Entrando…';
        try {
          const { error } = await supabase.auth.signInWithPassword({ email, password });
          if (error) throw error;
        } catch (error) {
          renderAuth(error.message || 'No se pudo iniciar sesión.');
        }
      });
    }

    async function loadProfile(){
      if(!session) return;
      currentUser = null;
      const { data, error } = await supabase.from('profiles').select('*').eq('id', session.user.id).maybeSingle();
      if(error) console.warn('No se pudo cargar el perfil:', error.message);
      currentUser = data || { id: session.user.id, email: session.user.email, role: 'voluntario' };
    }

    async function loadVolunteers(){
      const { data, error } = await supabase.from('volunteers').select('*').order('created_at', { ascending:false });
      if(error) throw error;
      volunteers = data || [];
    }

    async function loadDistricts(){
      const { data, error } = await supabase.from('districts').select('*').order('name');
      if(error){
        console.warn('No se pudieron cargar los distritos:', error.message);
        districts = [];
        return;
      }
      districts = data || [];
    }

    function roleLabel(role){
      const map = { admin:'Administrador', coordinador:'Coordinador', voluntario:'Voluntario' };
      return map[role] || role || 'Voluntario';
    }

    function statusLabel(status){
      const map = { activo:'Activo', pendiente:'Pendiente', inactivo:'Inactivo', nuevo:'Nuevo' };
      return map[status] || status || 'Nuevo';
    }

    function statusClass(status){
      return ({activo:'ok',pendiente:'wait',inactivo:'off',nuevo:'new'})[status] || 'new';
    }

    function canManage(){
      return ['admin','coordinador'].includes(currentUser?.role);
    }

    function canAdmin(){ return currentUser?.role === 'admin'; }

    function filteredVolunteers(){
      const term = searchTerm.toLowerCase();
      return volunteers.filter(v => {
        const haystack = [v.name,v.full_name,v.email,v.phone,v.district,v.centro,v.role,v.status].join(' ').toLowerCase();
        const matchesTerm = !term || haystack.includes(term);
        const matchesStatus = statusFilter === 'all' || (v.status || 'nuevo') === statusFilter;
        const matchesDistrict = districtFilter === 'all' || v.district === districtFilter;
        const matchesRole = roleFilter === 'all' || (v.role || 'voluntario') === roleFilter;
        return matchesTerm && matchesStatus && matchesDistrict && matchesRole;
      });
    }

    function renderApp(){
      document.body.classList.remove('rv-auth-active');
      $('rv-auth-mount').innerHTML = `
        <div id="rv-root">
          <header class="rv-head">
            <div class="rv-head-row">
              <div>
                <h1>Registro de Voluntarios · Regional 17 Monte Plata</h1>
                <p>Gestión y coordinación de voluntarios</p>
              </div>
              <div class="rv-me">
                <div>${esc(currentUser?.email || session?.user?.email || '')}</div>
                <span class="role">${esc(roleLabel(currentUser?.role))}</span><br>
                <button id="rv-signout">Cerrar sesión</button>
              </div>
            </div>
            <div class="rv-tabs">
              <button class="rv-tab ${activeTab==='volunteers'?'active':''}" data-tab="volunteers">Voluntarios</button>
              <button class="rv-tab ${activeTab==='self'?'active':''}" data-tab="self">Mi registro</button>
              <button class="rv-tab ${activeTab==='districts'?'active':''}" data-tab="districts">Distritos</button>
            </div>
          </header>
          <main class="rv-body" id="rv-content"></main>
        </div>`;

      $('rv-signout').onclick = async () => { await supabase.auth.signOut(); };
      document.querySelectorAll('.rv-tab').forEach(btn => btn.addEventListener('click', () => {
        activeTab = btn.dataset.tab;
        renderApp();
      }));

      if(activeTab === 'volunteers') renderVolunteersTab();
      else if(activeTab === 'self') renderSelfTab();
      else renderDistrictsTab();
    }

    function renderVolunteersTab(){
      const rows = filteredVolunteers();
      const counts = {
        total: volunteers.length,
        activo: volunteers.filter(v => v.status === 'activo').length,
        pendiente: volunteers.filter(v => v.status === 'pendiente').length,
        inactivo: volunteers.filter(v => v.status === 'inactivo').length,
        nuevo: volunteers.filter(v => !v.status || v.status === 'nuevo').length
      };
      $('rv-content').innerHTML = `
        <div class="rv-conn"><span class="dot"></span> Conectado a Supabase</div>
        <div class="rv-stats">
          <div class="rv-stat"><div class="n">${counts.total}</div><div class="l">Total</div></div>
          <div class="rv-stat ok"><div class="n">${counts.activo}</div><div class="l">Activos</div></div>
          <div class="rv-stat wait"><div class="n">${counts.pendiente}</div><div class="l">Pendientes</div></div>
          <div class="rv-stat off"><div class="n">${counts.inactivo}</div><div class="l">Inactivos</div></div>
          <div class="rv-stat new"><div class="n">${counts.nuevo}</div><div class="l">Nuevos</div></div>
        </div>
        <div class="rv-filters">
          <input id="rv-search" type="text" placeholder="Buscar por nombre, correo, teléfono, distrito…" value="${esc(searchTerm)}">
          <select id="rv-status-filter">
            <option value="all">Todos los estados</option>
            <option value="activo" ${statusFilter==='activo'?'selected':''}>Activo</option>
            <option value="pendiente" ${statusFilter==='pendiente'?'selected':''}>Pendiente</option>
            <option value="inactivo" ${statusFilter==='inactivo'?'selected':''}>Inactivo</option>
            <option value="nuevo" ${statusFilter==='nuevo'?'selected':''}>Nuevo</option>
          </select>
          <select id="rv-district-filter"><option value="all">Todos los distritos</option>${districts.map(d=>`<option value="${esc(d.name)}" ${districtFilter===d.name?'selected':''}>${esc(d.name)}</option>`).join('')}</select>
          <select id="rv-role-filter">
            <option value="all">Todos los roles</option>
            <option value="admin" ${roleFilter==='admin'?'selected':''}>Administrador</option>
            <option value="coordinador" ${roleFilter==='coordinador'?'selected':''}>Coordinador</option>
            <option value="voluntario" ${roleFilter==='voluntario'?'selected':''}>Voluntario</option>
          </select>
          ${canManage() ? '<button class="rv-btn primary" id="rv-add-vol">+ Agregar</button>' : ''}
        </div>
        <div style="overflow-x:auto">
          <table class="rv-table">
            <thead><tr><th>Voluntario</th><th>Contacto</th><th>Distrito</th><th>Áreas</th><th>Estado</th><th>Rol</th><th>Acciones</th></tr></thead>
            <tbody>${rows.length ? rows.map(volunteerRow).join('') : '<tr><td colspan="7"><div class="rv-empty">No se encontraron voluntarios.</div></td></tr>'}</tbody>
          </table>
        </div>`;

      $('rv-search').addEventListener('input', e => { searchTerm=e.target.value; renderVolunteersTab(); });
      $('rv-status-filter').addEventListener('change', e => { statusFilter=e.target.value; renderVolunteersTab(); });
      $('rv-district-filter').addEventListener('change', e => { districtFilter=e.target.value; renderVolunteersTab(); });
      $('rv-role-filter').addEventListener('change', e => { roleFilter=e.target.value; renderVolunteersTab(); });
      $('rv-add-vol')?.addEventListener('click', () => openVolunteerModal());
      document.querySelectorAll('[data-edit-vol]').forEach(b => b.addEventListener('click', () => openVolunteerModal(b.dataset.editVol)));
      document.querySelectorAll('[data-delete-vol]').forEach(b => b.addEventListener('click', () => deleteVolunteer(b.dataset.deleteVol)));
    }

    function volunteerRow(v){
      const id = v.id;
      const name = v.name || v.full_name || 'Sin nombre';
      const areas = Array.isArray(v.areas) ? v.areas : (typeof v.areas === 'string' ? v.areas.split(',').map(x=>x.trim()).filter(Boolean) : []);
      return `<tr>
        <td><div class="rv-name">${esc(name)}</div><div class="rv-sub">${esc(v.cedula || '')}</div></td>
        <td><div>${esc(v.email || '—')}</div><div class="rv-sub">${esc(v.phone || v.telefono || '—')}</div></td>
        <td><div>${esc(v.district || '—')}</div><div class="rv-sub">${esc(v.centro || '—')}</div></td>
        <td><div class="rv-areas-cell">${areas.length ? areas.map(a=>`<span class="rv-chip">${esc(a)}</span>`).join('') : '<span class="rv-sub">—</span>'}</div></td>
        <td><span class="badge ${statusClass(v.status)}"><span class="dot"></span>${esc(statusLabel(v.status))}</span></td>
        <td><span class="role-pill ${esc(v.role || 'voluntario')}">${esc(roleLabel(v.role || 'voluntario'))}</span></td>
        <td>${canManage() ? `<button class="rv-btn small" data-edit-vol="${esc(id)}">Editar</button> ${canAdmin() ? `<button class="rv-btn small danger" data-delete-vol="${esc(id)}">Eliminar</button>` : ''}` : '<span class="rv-sub">Solo lectura</span>'}</td>
      </tr>`;
    }

    function openVolunteerModal(id=null){
      const v = id ? volunteers.find(x => String(x.id) === String(id)) : {};
      const existingAreas = Array.isArray(v?.areas) ? v.areas : (typeof v?.areas === 'string' ? v.areas.split(',').map(x=>x.trim()).filter(Boolean) : []);
      const overlay = document.createElement('div');
      overlay.className='rv-overlay';
      overlay.innerHTML=`<div class="rv-modal">
        <h3>${id?'Editar voluntario':'Nuevo voluntario'}</h3><div class="rv-sub">Completa la información del registro.</div>
        <form id="rv-vol-form">
          <div class="rv-field"><label>Nombre completo</label><input name="name" type="text" required value="${esc(v?.name || v?.full_name || '')}"></div>
          <div class="rv-field"><label>Correo</label><input name="email" type="email" value="${esc(v?.email || '')}"></div>
          <div class="rv-field"><label>Teléfono</label><input name="phone" type="text" value="${esc(v?.phone || v?.telefono || '')}"></div>
          <div class="rv-field"><label>Cédula</label><input name="cedula" type="text" value="${esc(v?.cedula || '')}"></div>
          <div class="rv-field"><label>Distrito</label><select name="district"><option value="">Selecciona</option>${districts.map(d=>`<option value="${esc(d.name)}" ${v?.district===d.name?'selected':''}>${esc(d.name)}</option>`).join('')}</select></div>
          <div class="rv-field"><label>Centro</label><input name="centro" type="text" value="${esc(v?.centro || '')}"></div>
          <div class="rv-field"><label>Estado</label><select name="status"><option value="nuevo" ${(v?.status||'nuevo')==='nuevo'?'selected':''}>Nuevo</option><option value="activo" ${v?.status==='activo'?'selected':''}>Activo</option><option value="pendiente" ${v?.status==='pendiente'?'selected':''}>Pendiente</option><option value="inactivo" ${v?.status==='inactivo'?'selected':''}>Inactivo</option></select></div>
          <div class="rv-field"><label>Rol</label><select name="role"><option value="voluntario" ${(v?.role||'voluntario')==='voluntario'?'selected':''}>Voluntario</option><option value="coordinador" ${v?.role==='coordinador'?'selected':''}>Coordinador</option>${canAdmin()?`<option value="admin" ${v?.role==='admin'?'selected':''}>Administrador</option>`:''}</select></div>
          <div class="rv-field"><label>Áreas (separadas por coma)</label><input name="areas" type="text" value="${esc(existingAreas.join(', '))}"></div>
          <div class="rv-modal-actions"><button type="button" class="rv-btn" id="rv-cancel">Cancelar</button><button type="submit" class="rv-btn primary">Guardar</button></div>
        </form>
      </div>`;
      document.body.appendChild(overlay);
      overlay.querySelector('#rv-cancel').onclick=()=>overlay.remove();
      overlay.querySelector('#rv-vol-form').onsubmit=async e=>{
        e.preventDefault();
        const fd=new FormData(e.currentTarget);
        const payload={name:fd.get('name').trim(),email:fd.get('email').trim()||null,phone:fd.get('phone').trim()||null,cedula:fd.get('cedula').trim()||null,district:fd.get('district')||null,centro:fd.get('centro').trim()||null,status:fd.get('status'),role:fd.get('role'),areas:fd.get('areas').split(',').map(x=>x.trim()).filter(Boolean)};
        try{
          const result = id ? await supabase.from('volunteers').update(payload).eq('id',id) : await supabase.from('volunteers').insert(payload);
          if(result.error) throw result.error;
          overlay.remove(); await refreshData();
        }catch(err){ alert(err.message || 'No se pudo guardar el voluntario.'); }
      };
    }

    async function deleteVolunteer(id){
      if(!confirm('¿Seguro que deseas eliminar este voluntario? Esta acción no se puede deshacer.')) return;
      const { error } = await supabase.from('volunteers').delete().eq('id',id);
      if(error){ alert(error.message || 'No se pudo eliminar.'); return; }
      await refreshData();
    }

    function renderSelfTab(){
      const own = volunteers.find(v => v.user_id === session?.user?.id || v.email === session?.user?.email);
      $('rv-content').innerHTML = `
        <div class="rv-conn"><span class="dot"></span> Conectado a Supabase</div>
        <div class="rv-self-search">
          <div class="rv-sub" style="margin-bottom:6px">Busca tu registro por nombre o correo si todavía no está vinculado a tu cuenta.</div>
          <input id="rv-self-search" class="rv-filters" style="width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px" placeholder="Buscar tu registro…">
          <div id="rv-self-list" class="rv-self-list" style="display:none"></div>
        </div>
        <div id="rv-self-card">${own ? selfCard(own) : '<div class="rv-empty-self">No encontramos un registro vinculado a esta cuenta. Usa el buscador de arriba para localizarlo.</div>'}</div>`;
      const input=$('rv-self-search'), list=$('rv-self-list');
      input.addEventListener('input',()=>{
        const q=input.value.toLowerCase().trim();
        if(!q){list.style.display='none';return;}
        const matches=volunteers.filter(v=>[v.name,v.full_name,v.email].join(' ').toLowerCase().includes(q)).slice(0,8);
        list.innerHTML=matches.length?matches.map(v=>`<div class="rv-self-item" data-self-id="${esc(v.id)}"><strong>${esc(v.name||v.full_name||'Sin nombre')}</strong><div class="rv-sub">${esc(v.email||'')}</div></div>`).join(''):'<div class="rv-self-item">Sin resultados</div>';
        list.style.display='block';
        list.querySelectorAll('[data-self-id]').forEach(item=>item.onclick=()=>{ const selected=volunteers.find(v=>String(v.id)===item.dataset.selfId); $('rv-self-card').innerHTML=selfCard(selected); list.style.display='none'; });
      });
    }

    function selfCard(v){
      const areas=Array.isArray(v?.areas)?v.areas:(typeof v?.areas==='string'?v.areas.split(',').map(x=>x.trim()).filter(Boolean):[]);
      return `<div class="rv-self-card"><h3>${esc(v?.name||v?.full_name||'Sin nombre')}</h3><div class="rv-sub">${esc(v?.email||'')}</div><div style="margin-top:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px"><div><div class="rv-sub">Teléfono</div><strong>${esc(v?.phone||v?.telefono||'—')}</strong></div><div><div class="rv-sub">Distrito</div><strong>${esc(v?.district||'—')}</strong></div><div><div class="rv-sub">Centro</div><strong>${esc(v?.centro||'—')}</strong></div><div><div class="rv-sub">Estado</div><span class="badge ${statusClass(v?.status)}"><span class="dot"></span>${esc(statusLabel(v?.status))}</span></div></div><div style="margin-top:18px"><div class="rv-sub" style="margin-bottom:6px">Áreas</div><div class="rv-areas-cell">${areas.length?areas.map(a=>`<span class="rv-chip">${esc(a)}</span>`).join(''):'<span class="rv-sub">Sin áreas registradas</span>'}</div></div><div class="rv-saved-msg" id="rv-self-saved"></div>${canManage()?`<div style="margin-top:16px"><button class="rv-btn primary" onclick="window.__rvEditSelf('${esc(v?.id)}')">Editar registro</button></div>`:''}</div>`;
    }

    window.__rvEditSelf = (id) => openVolunteerModal(id);

    function renderDistrictsTab(){
      $('rv-content').innerHTML = `
        <div class="rv-conn"><span class="dot"></span> Conectado a Supabase</div>
        <div class="rv-district-grid">
          ${districts.length ? districts.map(d=>districtCard(d)).join('') : '<div class="rv-empty">No hay distritos configurados.</div>'}
        </div>`;
      document.querySelectorAll('[data-add-centro]').forEach(form=>form.addEventListener('submit',async e=>{
        e.preventDefault();
        if(!canManage()) return;
        const districtId=e.currentTarget.dataset.addCentro;
        const input=e.currentTarget.querySelector('input');
        const name=input.value.trim(); if(!name) return;
        try{
          const {error}=await supabase.from('centros').insert({district_id:districtId,name});
          if(error) throw error;
          input.value=''; await refreshData();
        }catch(err){alert(err.message||'No se pudo agregar el centro.');}
      }));
    }

    function districtCard(d){
      const centros = Array.isArray(d.centros) ? d.centros : [];
      return `<div class="rv-district-card"><h4>${esc(d.name)}</h4><div class="rv-sub">${esc(d.code||'')} · ${centros.length} centro(s)</div>${centros.length?centros.map(c=>`<div class="rv-centro-row"><span>${esc(c.name||c)}</span>${canAdmin()&&c.id?`<button class="rv-btn small danger" onclick="window.__rvDeleteCentro('${esc(c.id)}')">Eliminar</button>`:''}</div>`).join(''):'<div class="rv-sub">Sin centros registrados.</div>'}${canManage()?`<form class="rv-add-centro" data-add-centro="${esc(d.id)}"><input placeholder="Nuevo centro"><button class="rv-btn small" type="submit">Agregar</button></form>`:''}</div>`;
    }

    window.__rvDeleteCentro = async (id) => {
      if(!confirm('¿Eliminar este centro?')) return;
      const {error}=await supabase.from('centros').delete().eq('id',id);
      if(error){alert(error.message||'No se pudo eliminar.');return;}
      await refreshData();
    };

    async function refreshData(){
      try{
        await Promise.all([loadVolunteers(),loadDistricts()]);
        renderApp();
      }catch(error){
        console.error(error);
        $('rv-content') && ($('rv-content').innerHTML=`<div class="rv-banner">No se pudieron actualizar los datos: ${esc(error.message||error)}</div>`);
      }
    }

    async function bootAuthenticated(){
      await loadProfile();
      try{
        await Promise.all([loadVolunteers(),loadDistricts()]);
      }catch(error){
        console.error('Error cargando datos:',error);
      }
      renderApp();
    }

    supabase.auth.onAuthStateChange((_event, newSession) => {
      session = newSession;
      if(session){
        bootAuthenticated();
      } else {
        currentUser = null;
        volunteers = [];
        districts = [];
        renderAuth();
      }
    });

    window.addEventListener('error', (ev) => {
      console.error('Error no controlado:', ev.error || ev.message);
    });
    window.addEventListener('unhandledrejection', (ev) => {
      console.error('Promesa rechazada sin controlar:', ev.reason);
    });

    function init(){
      if(SUPABASE_URL.includes('TU-PROYECTO') || SUPABASE_ANON_KEY.includes('TU-ANON-KEY')){
        renderConfigNeeded();
        return;
      }

      document.body.classList.add('rv-auth-active');

      document.getElementById('rv-auth-mount').innerHTML =
        `<div class="rv-status-page">
          <div class="rv-loading">Cargando…</div>
        </div>`;

      supabase.auth.getSession().then(({ data, error }) => {
        if(error) throw error;

        session = data.session;

        if(session){
          bootAuthenticated();
        } else {
          renderAuth();
        }

      }).catch(e => {
        console.error(e);
        renderStartupError(e);
      });
    }

    init();
  })();
})();
</script>
</body>
</html>
